name: Manual tests (no automatic Actions usage)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Synthetic end-to-end smoke run
        run: python -m tlab.experiment --demo --users 12 --candidates 36 --snapshots 3 --iterations 30 --threads 2 --output results/demo
      - name: Upload synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-smoke-results
          path: results/demo
          if-no-files-found: ignore
