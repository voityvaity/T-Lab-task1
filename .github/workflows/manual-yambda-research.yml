name: Manual Yambda research (can consume substantial Actions minutes)

on:
  workflow_dispatch:
    inputs:
      users:
        description: "Number of complete user histories (100 recommended initially)"
        required: true
        default: "100"
        type: choice
        options: ["100", "1000"]
      evaluation_mode:
        description: "Single last day or exploratory three-day temporal robustness (longer run)"
        required: true
        default: "single"
        type: choice
        options: ["single", "temporal_0_21_42"]
      seed:
        description: "Random full-user cohort for independent repeat"
        required: true
        default: "42"
        type: choice
        options: ["42", "137", "2026"]
      iterations:
        description: "CatBoost iterations per model"
        required: true
        default: "120"
        type: choice
        options: ["120", "250"]

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Prevent accidental oversized experiments
        env:
          USERS: ${{ inputs.users }}
          EVAL_MODE: ${{ inputs.evaluation_mode }}
        run: |
          test "$USERS" = "100" || test "$USERS" = "1000"
          test "$EVAL_MODE" = "single" || test "$EVAL_MODE" = "temporal_0_21_42"
      - name: Run fast regression tests before costly download
        run: pytest -q
      - name: Run synthetic end-to-end gate before costly download
        run: python -m tlab.experiment --demo --users 8 --snapshots 1 --candidates 24 --iterations 10 --threads 2 --output results/preflight-synthetic
      - name: Run synthetic three-cutoff gate before costly download
        if: ${{ inputs.evaluation_mode == 'temporal_0_21_42' }}
        run: |
          python -m tlab.robustness --demo --users 6 --seed 21 \
            --snapshots 1 --iterations 5 --candidates 24 --threads 2 \
            --lags "0,21" --output results/preflight-temporal
          test -s results/preflight-temporal/TEMPORAL_REPORT.md
          test -s results/preflight-temporal/temporal_robustness.json
      - name: Fetch only Yambda-50M listens
        run: python -m tlab.data download --output data --with-metadata
      - name: Run point-in-time experiment
        env:
          USERS: ${{ inputs.users }}
          ITERATIONS: ${{ inputs.iterations }}
          SEED: ${{ inputs.seed }}
          EVAL_MODE: ${{ inputs.evaluation_mode }}
        run: |
          if [ "$EVAL_MODE" = "temporal_0_21_42" ]; then
            /usr/bin/time -v python -m tlab.robustness \
              --data data/flat/50m/listens.parquet \
              --users "$USERS" --seed "$SEED" \
              --iterations "$ITERATIONS" --threads 4 \
              --lags "0,21,42" --metadata-dir data --output results/yambda
          else
            /usr/bin/time -v python -m tlab.experiment \
              --data data/flat/50m/listens.parquet \
              --users "$USERS" --seed "$SEED" \
              --iterations "$ITERATIONS" --threads 4 \
              --metadata-dir data --output results/yambda
          fi
      - name: Upload measured report (never raw data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yambda-research-report
          path: results/yambda
          if-no-files-found: ignore
          retention-days: 30
